name: Feature Request
description: 给 KiteBlog 提建议
title: "[Feature]: "
labels: ["enhancement"]
assignees:
  - ciyuan1234
body:
  - type: markdown
    attributes:
      value: |
        感谢给 KiteBlog 提建议。
  - type: textarea
    id: related-problem
    attributes:
      label: 这个需求解决什么问题？
      description: 请描述当前不方便的地方。
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 你希望怎么实现？
      description: 请描述你想要的效果。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 其他方案
      description: 可选，说明你考虑过的替代方案。
  - type: textarea
    id: additional-context
    attributes:
      label: 补充信息
      description: 可添加截图、参考链接或其他背景。
